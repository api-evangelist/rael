constraints:
- Checkout completion requires contemporaneous buyer approval; agents must not complete payment without
  explicit buyer consent (stated in https://www.getrael.com/llms.txt).
- The endpoint is rate limited per IP; back off on 429 (stated in llms.txt).
- Prices are integers in ISO 4217 minor units paired with a currency code (stated in the tool descriptions
  returned by tools/list).
- Agents should pass context.address_country and context.currency for accurate pricing.
