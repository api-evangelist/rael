name: Rael UCP Commerce MCP Server
status: live
description: Rael's storefront exposes a live, anonymous MCP server implementing the Universal Commerce
  Protocol (UCP) shopping service. An unauthenticated POST of {"jsonrpc":"2.0","id":1, "method":"tools/list"}
  returned HTTP 200 with 13 tools, each carrying a complete JSON Schema inputSchema — no OAuth challenge,
  no API key. The saved manifest in rael-mcp-tools.json is the verbatim response body.
ownership_note: 'The endpoint is served from Rael''s own domain (www.getrael.com) and its catalog, cart
  and order tools operate on Rael''s store only. The server software is Shopify''s — Shopify ships UCP
  natively for every store, the /.well-known/ucp profile advertises the canonical form of the endpoint
  on the shop''s myshopify alias (raelbox-com.myshopify.com/api/ucp/mcp), and the response carries powered-by:
  Shopify. This is the templated/platform-hosted case: the contract is real, live and scoped to Rael,
  but Rael did not author the tool schemas.'
