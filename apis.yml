aid: rael
name: Rael
description: 'Rael is a holistic personal-care brand founded in 2017 by three Korean-American women and
  led by co-founder and CEO Yanghee Paik, selling organic-cotton period care, intimate care, skincare
  and cycle supplements direct to consumers at getrael.com and through Target, Amazon, Walmart and Thrive
  Market. Rael runs no developer program, publishes no OpenAPI and ships no SDK — but its storefront serves
  two live, anonymous, machine-readable contracts on its own domain. The first is an agentic commerce
  surface Rael documents itself: a hand-written llms.txt and agents.md, a Universal Commerce Protocol
  merchant profile at /.well-known/ucp declaring UCP 2026-04-08, and an MCP endpoint at /api/ucp/mcp that
  answers tools/list with thirteen catalog, cart, checkout and order tools carrying full JSON Schema inputs
  and a required idempotency key on checkout completion. The second is the Shopify Storefront GraphQL
  API at /api/graphql, fully introspectable without a credential — 422 types, 34 queries and 41 mutations
  resolving against Rael''s own catalog.'
