- aid: rael:rael-storefront-graphql
  name: Rael Storefront GraphQL API
  description: 'The Shopify Storefront GraphQL API as served on Rael''s own domain, anonymous and fully
    introspectable. A live IntrospectionQuery returned 422 types with QueryRoot (34 query fields) and
    Mutation (41 mutations) covering products, collections, search, cart, customer accounts, blog/page
    content and store metadata. Confirmed to resolve against Rael''s own store: { shop { name primaryDomain
    { url } } } returns "Rael" / https://www.getrael.com. Rael neither authored nor documents this schema;
    it is the platform contract exposed on its host, and it is a materially larger surface than the UCP
    MCP endpoint.'
  humanURL: https://www.getrael.com/llms.txt
  baseURL: https://www.getrael.com/api/2024-01/graphql.json
