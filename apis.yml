apis:
- aid: rael:rael-ucp-mcp
  name: Rael UCP Commerce MCP
  description: Rael's agent-facing commerce interface. The store implements the Universal Commerce Protocol
    (UCP) 2026-04-08 and exposes it over MCP at https://www.getrael.com/api/ucp/mcp. An anonymous tools/list
    returns thirteen tools — search_catalog, lookup_catalog, get_product, create/get/update/cancel_cart
    and create/get/update/complete/cancel_checkout, plus get_order — each with a full JSON Schema inputSchema.
    Checkout completion requires contemporaneous buyer approval; the endpoint is rate limited per IP and
    returns Shopify complexity-score headers.
  humanURL: https://www.getrael.com/llms.txt
  baseURL: https://www.getrael.com/api/ucp/mcp
  tags:
